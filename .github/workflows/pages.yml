name: Daily picks website

on:
  schedule:
    - cron: "17 7 * * 1-5"   # 5:17pm AEST / 6:17pm AEDT, after the ASX close
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "docs/**"
      - "ml/**"
      - "stocktrade.py"
      - "config.example.yaml"
      - "requirements.txt"
      - ".github/workflows/pages.yml"

permissions:
  contents: write   # saves the append-only paper-tracking and delisting logs
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Restore model weights and forecast cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/timesfm_cache
          key: timesfm-${{ github.run_id }}
          restore-keys: timesfm-
      - name: Self-check
        run: |
          python ml/test_timesfm_strategy.py
          python ml/test_strategy_v2.py
      - name: Download latest ASX prices
        run: time python stocktrade.py --log-level WARNING ingest
      - name: Legacy weekly TimesFM picks and backtest
        run: time python stocktrade.py tfm-publish --out docs/data/latest.json
      - name: Today's recommendation (monthly strategy or index ETF)
        run: time python stocktrade.py --log-level WARNING strat-recommend
      - name: Merge strategy results into dashboard data
        run: time python stocktrade.py strat-publish
      - name: Save paper-tracking and delisting logs
        if: github.ref == 'refs/heads/main'
        run: |
          git add results/paper results/survivorship 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Daily paper-tracking and delisting log update [skip ci]"
            git pull --rebase --autostash origin main && git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
