name: Strategy research

on:
  schedule:
    - cron: "41 20 2 * *"     # 2nd of each month, 6:41am AEST
  workflow_dispatch:
  push:
    branches: ["claude/**"]  # validate research changes on feature branches (results are not committed there)
    paths:
      - "ml/signals.py"
      - "ml/portfolio.py"
      - "ml/validation.py"
      - "ml/strategy_cli.py"
      - "ml/data_asic.py"
      - "ml/optimizer.py"
      - "ml/policies.py"
      - ".github/workflows/research.yml"

permissions:
  contents: write

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # Caches persist between runs (GitHub Actions cache, 7-day eviction if unused; the monthly run refreshes them).
      - name: Restore TimesFM weights, monthly forecast cache and ASIC reports
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface
            data/tfm_cache
            data/asic_short
          key: research-${{ github.run_id }}
          restore-keys: research-
      - name: Self-check
        run: |
          python ml/test_strategy_v2.py
          python ml/test_engine_repairs.py
          python ml/test_optimizer.py
          python ml/test_accounting.py
          python ml/test_policies.py
      - name: Download ASX prices
        run: time python stocktrade.py --log-level WARNING ingest
      - name: Download ASIC short-position history (optional)
        continue-on-error: true
        timeout-minutes: 120
        run: time python stocktrade.py asic-download --start 2015-06-01
      - name: TimesFM monthly forecasts (index-relative)
        continue-on-error: true  # resumable; the next run finishes it
        timeout-minutes: 120
        run: time python stocktrade.py tfm-cache --transform rel
      - name: TimesFM monthly forecasts (raw price)
        continue-on-error: true  # resumable; the next run finishes it
        timeout-minutes: 120
        run: time python stocktrade.py tfm-cache --transform raw
      - name: Save caches (even if a later step fails, so slow downloads are not repeated)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface
            data/tfm_cache
            data/asic_short
          key: research-${{ github.run_id }}
      - name: Strategy grid, walk-forward and validation
        run: time python stocktrade.py strat-backtest
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-results
          path: results/
      - name: Commit results for the daily dashboard
        if: github.ref == 'refs/heads/main'
        run: |
          git add results/strategy_compare.csv results/strategy_compare.json results/validation.json \
                  results/frozen_choice.json results/trials_log.csv results/history.json \
                  results/instrument_types.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Monthly strategy research results [skip ci]"
            git pull --rebase --autostash origin main && git push
          fi
